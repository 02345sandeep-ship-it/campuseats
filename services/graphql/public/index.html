<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats | GraphQL Menu</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #18352c; background: #f4f7ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #174b39; color: #fff; padding: 1.4rem max(1.25rem, calc((100vw - 1040px)/2)); }
    header strong { font-size: 1.35rem; letter-spacing: -.03em; }
    header span { display: block; margin-top: .35rem; color: #d2e7d8; }
    main { width: min(1040px, calc(100% - 2rem)); margin: 2.5rem auto; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, .8fr); gap: 1.25rem; }
    section { background: #fff; border: 1px solid #e0e8dc; border-radius: 18px; padding: 1.4rem; box-shadow: 0 8px 26px #174b390b; }
    h1,h2,p { margin-top: 0; } h1 { font-size: 1.65rem; margin-bottom: .35rem; } h2 { font-size: 1.15rem; }
    .muted { color: #66756c; } .dish-list { display: grid; gap: .7rem; margin-top: 1.2rem; }
    .dish { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: .95rem 1rem; border: 1px solid #e7ede5; border-radius: 12px; }
    .dish-name { font-weight: 650; } .dish-meta { font-size: .88rem; color: #66756c; margin-top: .25rem; }
    .price { font-weight: 700; white-space: nowrap; } .badge { display: inline-block; padding: .25rem .55rem; border-radius: 99px; background: #e3f4e7; color: #23623b; font-size: .78rem; }
    .badge.off { background: #f1f1ee; color: #71756f; }
    label { display: block; font-size: .9rem; font-weight: 600; margin: 1rem 0 .4rem; }
    input { width: 100%; border: 1px solid #cdd8cd; border-radius: 9px; padding: .75rem .8rem; font: inherit; }
    input:focus { outline: 2px solid #78b58b; border-color: transparent; }
    button { width: 100%; border: 0; border-radius: 9px; padding: .8rem 1rem; margin-top: 1.1rem; background: #24724f; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #195c3c; } button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.4rem; margin: .75rem 0 0; font-size: .9rem; } #status.error { color: #a3332b; } #status.success { color: #23623b; }
    .empty { padding: 1.2rem; border-radius: 12px; background: #f7f9f5; color: #66756c; text-align: center; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; margin-top: 1.25rem; } }
  </style>
</head>
<body>
  <header><strong>CampusEats</strong><span>CS543 Web Services · Assignment 7 · GraphQL menu demo</span></header>
  <main>
    <section aria-labelledby="menu-title">
      <h1 id="menu-title">Today's menu</h1>
      <p class="muted">Live dishes loaded from the CampusEats GraphQL API.</p>
      <div id="dish-list" class="dish-list" aria-live="polite"><p class="muted">Loading menu…</p></div>
    </section>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Add a dish</h2>
      <p class="muted">New dishes are saved to the menu database.</p>
      <form id="dish-form">
        <label for="name">Dish name</label>
        <input id="name" name="name" maxlength="120" required placeholder="e.g. Paneer Roll">
        <label for="price">Price (₹)</label>
        <input id="price" name="price" type="number" min="0" step="0.01" required placeholder="90">
        <button id="submit" type="submit">Add to menu</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const endpoint = `${window.location.protocol}//${window.location.host}/graphql`;
    const list = document.querySelector('#dish-list');
    const form = document.querySelector('#dish-form');
    const status = document.querySelector('#status');
    const submit = document.querySelector('#submit');

    async function graphql(query, variables) {
      const response = await fetch(endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      const result = await response.json();
      if (!response.ok || result.errors) throw new Error(result.errors?.[0]?.message || 'The request failed.');
      return result.data;
    }

    async function loadDishes() {
      list.innerHTML = '<p class="muted">Loading menu…</p>';
      try {
        const data = await graphql('{ dishes { id name price available } }');
        if (!data.dishes.length) { list.innerHTML = '<div class="empty">No dishes yet. Add the first one!</div>'; return; }
        list.replaceChildren(...data.dishes.map((dish) => {
          const card = document.createElement('article'); card.className = 'dish';
          const details = document.createElement('div');
          const name = document.createElement('div'); name.className = 'dish-name'; name.textContent = dish.name;
          const meta = document.createElement('div'); meta.className = 'dish-meta'; meta.textContent = `ID ${dish.id} · `;
          const badge = document.createElement('span'); badge.className = `badge${dish.available ? '' : ' off'}`; badge.textContent = dish.available ? 'Available' : 'Unavailable';
          meta.append(badge); details.append(name, meta);
          const price = document.createElement('div'); price.className = 'price'; price.textContent = `₹${Number(dish.price).toFixed(2)}`;
          card.append(details, price); return card;
        }));
      } catch (error) { list.innerHTML = '<div class="empty">Could not load dishes. Check that the GraphQL server and database are running.</div>'; showStatus(error.message, true); }
    }

    function showStatus(message, isError = false) {
      status.textContent = message; status.className = isError ? 'error' : 'success';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = form.elements.name.value.trim();
      const price = Number(form.elements.price.value);
      if (!name || !Number.isFinite(price) || price < 0) { showStatus('Enter a dish name and a non-negative price.', true); return; }
      submit.disabled = true; submit.textContent = 'Adding…'; showStatus('');
      try {
        await graphql('mutation AddDish($input: AddDishInput!) { addDish(input: $input) { id } }', { input: { name, price } });
        form.reset(); showStatus('Dish added to the menu.'); await loadDishes();
      } catch (error) { showStatus(error.message, true); }
      finally { submit.disabled = false; submit.textContent = 'Add to menu'; }
    });

    loadDishes();
  </script>
</body>
</html>
